input {
  touchpad {
    natural_scroll = true
    scroll_factor = 0.2
  }
  repeat_rate = 25
  repeat_delay = 600
}

gestures {
    workspace_swipe_distance = 300
    workspace_swipe_cancel_ratio = 0.1
}

misc {
  disable_hyprland_logo = true
}

general {
  gaps_in = 15
  gaps_out = 50
  border_size = 0
  layout = scrolling
}

cursor {
  inactive_timeout = 3
}

xwayland {
  force_zero_scaling = true
}

dwindle {
  force_split = 2
}

decoration {
  rounding = 10

  shadow {
    enabled = false
    range = 10
    render_power = 3
    color = rgba(1a1a1aee)
  }
}

animations {
    enabled = true

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear

    animation = workspaces, 1, 3, easeOutQuint, slidevert
}

group {
  col.border_active = rgba(88888888)
  col.border_inactive = rgba(44444488)

  groupbar {
    enabled = true
    font_family = sans-serif  # Change this to match your system font
    font_size = 11
    
    col.active = rgba(4a4a4aee)    # Lighter background for the active (highlighted) tab
    col.inactive = rgba(2a2a2aee)  # Darker background for the background tabs
    col.locked_active = rgba(4a4a4aee)
    col.locked_inactive = rgba(2a2a2aee)
    
    # The text color of the tab titles
    text_color = rgba(ffffffff)
  }
}

# Gestures
gesture = 2, down, mod: ALT, close
gesture = 3, up, mod: ALT, fullscreen
gesture = 3, down, mod: ALT, fullscreen
gesture = 2, swipe, mod: $mod, move

gesture = 3, vertical, workspace

gesture = 3, left, dispatcher, layoutmsg, move +col
gesture = 3, right, dispatcher, layoutmsg, move -col

# Mod key
$mod = SUPER

# Terminal
bind = $mod, Return, exec, wezterm

# App launcher
bind = $mod, space, exec, rofi -show drun

# Close active window
bind = $mod, c, killactive

# Move to workspace (1-9)
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

# Move window to workspace (1-9)
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# Switch to previous workspace
bind = $mod, Tab, workspace, previous

# Move window to previous workspace
bind = $mod SHIFT, Tab, movetoworkspace, previous

# Toggle floating mode
bind = $mod SHIFT, Space, togglefloating

# Fullscreen
bind = $mod, f, fullscreen

# Move focus with arrow keys
bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d

# Move window with arrow keys
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, l, movewindow, r
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, j, movewindow, d

# Resize windows with arrow keys
bind = $mod CTRL, h, resizeactive, -20 0
bind = $mod CTRL, l, resizeactive, 20 0
bind = $mod CTRL, k, resizeactive, 0 -20
bind = $mod CTRL, j, resizeactive, 0 20

# Scrolling
bind = $mod, period, layoutmsg, move +col
bind = $mod, comma, layoutmsg, move -col

bind = $mod SHIFT, period, layoutmsg, swapcol r
bind = $mod SHIFT, comma, layoutmsg, swapcol l

bind = $mod CTRL, period, layoutmsg, colresize +0.1
bind = $mod CTRL, comma, layoutmsg, colresize -0.1

bind = $mod SHIFT, f, layoutmsg, fit active

# Scratchpad
bind = $mod SHIFT, slash, movetoworkspace, special:magic

bind = $mod, slash, togglespecialworkspace, magic

# Groups
bind = $mod, g, togglegroup
bind = ALT, Tab, changegroupactive, f

binds {
    drag_threshold = 10
}
bindm = ALT, mouse:272, movewindow      # ALT + LMB: Move a window by dragging more than 10px.

# rotate
bind = SUPER ALT, Up, exec, hyprctl keyword monitor eDP-1,preferred,auto,1.60,transform,0
bind = SUPER ALT, Right, exec, hyprctl keyword monitor eDP-1,preferred,auto,1.60,transform,1
bind = SUPER ALT, Down, exec, hyprctl keyword monitor eDP-1,preferred,auto,1.60,transform,2
bind = SUPER ALT, Left, exec, hyprctl keyword monitor eDP-1,preferred,auto,1.60,transform,3

# Screenshot (using grim + slurp)
bind = $mod SHIFT, s, exec, grim -g "$(slurp -c ffffff80 -b 00000099)" - | wl-copy -t image/png
bind = $mod CTRL, s, exec, grim -g "$(slurp -c ffffff80 -b 00000099)" ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png

# Volume control
binde = , XF86AudioRaiseVolume, exec, pamixer -i 5
binde = , XF86AudioLowerVolume, exec, pamixer -d 5
binde = CTRL, XF86AudioRaiseVolume, exec, pamixer -i 5 --allow-boost
binde = CTRL, XF86AudioLowerVolume, exec, pamixer -d 5 --allow-boost

# brightness control
binde = , XF86MonBrightnessUp, exec, brightnessctl s +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# asusctl
bind = , XF86KbdBrightnessUp, exec, asusctl -n
bind = , XF86KbdBrightnessDown, exec, asusctl -p
bind = , XF86Launch3, exec, asusctl aura -n

bindm = ALT, mouse:272, movewindow      
bindc = ALT, mouse:272, togglefloating  

# reload Hyprland configuration
bind = $mod SHIFT, r, exec, pls home

# Exit Hyprland (logout)
bind = $mod SHIFT, e, exit

exec-once = hyprpaper
exec-once = batd
exec-once = QS_ICON_THEME=Papirus-Dark qs
